# ja-video-subtitles configuration
# Usage: cp config.example.toml config.toml, then fill in api_key.

[deepseek]
# OpenAI-compatible endpoint
base_url = "https://api.deepseek.com"
# Required: your DeepSeek API key (https://platform.deepseek.com)
api_key = "your-api-key-here"
# Translation model
model = "deepseek-flash"

[asr]
# Japanese ASR model (faster-whisper format); the default is recommended
model_id = "kotoba-tech/kotoba-whisper-v2.0-faster"

# Defaults for `run`. Explicit CLI options always win over these settings;
# relative paths are resolved against the directory where you run the command.
# Setting force/yes to true behaves exactly like passing --force/-y.
[run]
# Positional input: an mp4/mov file or a folder of them.
# input = "videos"
# -o/--output-dir: subtitles, sub.mp4, MP3, log, and report.
# output_dir = "out"
# --force: redo every stage, ignoring existing artifacts.
force = false
# -y/--yes: overwrite existing outputs without asking.
yes = false

# Defaults for standalone `burn`; ignored by `run`.
[burn]
# Positional inputs: mp4/mov files or folders (nonrecursive). A CLI input
# list replaces this whole list instead of appending to it.
# inputs = ["video.mp4", "more-videos"]
# -o/--output-dir: burned videos, log, and report.
# output_dir = "burned"
# -s/--subtitles: one explicit SRT, only for a single video after expansion.
# Do not set it together with subtitle_dir.
# subtitles = "edited.srt"
# --subtitle-dir: directory of <video-stem>.bilingual.srt files.
# Empty means: match subtitles inside the effective output directory.
# subtitle_dir = "subtitles"
# -y/--yes: overwrite existing outputs without asking.
yes = false

# Companion vocabulary glossary; standalone `burn` ignores this section.
[vocabulary]
# Omitted CLI options use these settings; each CLI option overrides only its own setting.
# --vocab-output-dir: empty = -o (the generated .sub.mp4 directory); relative paths use cwd.
output_dir = ""
# --vocab-format: md, json, or both. Default: write both Markdown and JSON.
format = "both"
enabled = true
# Only levels harder than this level are included: N3 -> N2 and N1.
# JLPT assignments are non-official references from the bundled dataset.
learner_level = "N3"  # N5, N4, N3, N2, or N1
include_unknown = true  # Also include ungraded content words and proper nouns.
max_examples = 3  # Distinct subtitle contexts per word, from 1 to 10.

# Translation prompts (optional; delete to use the built-in defaults).
# user_template placeholders: {n} batch size, {context} preceding lines,
# {lines} numbered source lines.
[prompt]
system = """You are a professional subtitle translator. Translate Japanese subtitles into natural, fluent Simplified Chinese.
Rules:
1. Colloquial and idiomatic Chinese;
2. Keep each line within 24 Chinese characters when possible;
3. Keep names and proper nouns consistent;
4. Output only the translation, no explanations."""
user_template = """Below are {n} consecutive Japanese subtitle lines. Translate each into Simplified Chinese.
Reply strictly in the format "N. translation", one line each, numbered 1 to {n}. Do not merge, split, or skip any line.

Context (for understanding only, do NOT translate):
{context}

Subtitles to translate:
{lines}"""

# Subtitle style for burn-in (optional, libass force_style format)
[style]
force_style = "FontName=PingFang SC,FontSize=20,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=0,MarginV=28,Alignment=2"

# Burn-in video parameters (optional)
[video]
# h264_videotoolbox hardware encoder bitrate; raise to 16M+ for 4K sources
bitrate = "8M"
